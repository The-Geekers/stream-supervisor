services:
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-supervisor
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
