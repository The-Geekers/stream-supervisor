services:
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-supervisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8090
      SYSTEM_PROC_ROOT: /host/proc
      SYSTEM_DISK_PATH: /host/disk
      SYSTEM_NETWORK_ROOT: /host/net
      SYSTEM_NETWORK_INTERFACE: ${SYSTEM_NETWORK_INTERFACE:-ens3}
      DOCKER_STATUS_FILE: /runtime/docker-status/status.json
      DOCKER_CONTROL_URL: http://docker-control:8181
      EVENTS_FILE: /data/events.jsonl
      INCIDENT_STATE_FILE: /data/incidents-state.json
      WATCHDOG_STATE_FILE: /data/watchdog-state.json
    volumes:
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /proc/uptime:/host/proc/uptime:ro
      - /sys/class/net/${SYSTEM_NETWORK_INTERFACE:-ens3}/statistics/rx_bytes:/host/net/rx_bytes:ro
      - /sys/class/net/${SYSTEM_NETWORK_INTERFACE:-ens3}/statistics/tx_bytes:/host/net/tx_bytes:ro
      - ./runtime/disk-probe:/host/disk:ro
      - docker_status:/runtime/docker-status:ro
      - supervisor_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - web-proxy
      - control

  docker-observer:
    build:
      context: ./docker-observer
      dockerfile: Dockerfile
    container_name: stream-supervisor-docker-observer
    restart: unless-stopped
    network_mode: none
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      OUTPUT_FILE: /output/status.json
      OBSERVER_INTERVAL_MS: 2000
      DOCKER_MONITOR_CONTAINERS: ${DOCKER_MONITOR_CONTAINERS:-restreamer,stream-supervisor}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_status:/output
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  docker-control:
    build:
      context: ./docker-control
      dockerfile: Dockerfile
    container_name: stream-supervisor-docker-control
    restart: unless-stopped
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      CONTROL_PORT: 8181
      DOCKER_RESTART_CONTAINER: restreamer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - control

volumes:
  docker_status:
  supervisor_data:

networks:
  web-proxy:
    external: true
  control:
    internal: true
