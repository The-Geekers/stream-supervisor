name: quality

on:
  push:
    branches:
      - main
      - "dev/**"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Unit, syntax and repository secret checks
        run: |
          npm run check
          sh -n deployment/update.sh
          sh -n deployment/configure-auth.sh

      - name: Docker build
        run: docker build -t stream-supervisor-ci .

      - name: Docker Compose configuration
        run: |
          cp .env.example .env
          mkdir -p runtime/disk-probe
          export SYSTEM_NETWORK_INTERFACE="$(ip route show default | awk '/default/ {for (i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')"
          test -n "$SYSTEM_NETWORK_INTERFACE"
          docker network create web-proxy >/dev/null
          docker compose config -q

      - name: Container health smoke test
        run: |
          docker run -d --name stream-supervisor-ci --env-file .env -e DEMO_MODE=true -p 8090:8090 stream-supervisor-ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/health
          curl -fsS http://127.0.0.1:8090/api/status >/dev/null
          curl -fsS http://127.0.0.1:8090/api/incidents | node -e '
            let raw="";
            process.stdin.on("data", c => raw += c);
            process.stdin.on("end", () => {
              const data=JSON.parse(raw);
              if (!Array.isArray(data.active) || !Array.isArray(data.events)) process.exit(1);
              if (typeof data.summary?.active !== "number") process.exit(1);
            });
          '
          curl -fsS http://127.0.0.1:8090/api/diagnostics | node -e '
            let raw="";
            process.stdin.on("data", c => raw += c);
            process.stdin.on("end", () => {
              const data=JSON.parse(raw);
              if (!Array.isArray(data.checks)) process.exit(1);
              if (!data.security || data.security.rawEnginePayloadIncluded !== false) process.exit(1);
              if (!["ok","warning","critical"].includes(data.overall)) process.exit(1);
            });
          '
          curl -fsS http://127.0.0.1:8090/api/watchdog | node -e '
            let raw="";
            process.stdin.on("data", c => raw += c);
            process.stdin.on("end", () => {
              const data=JSON.parse(raw);
              if (data.mode !== "observe") process.exit(1);
              if (data.outputRecoveryEnabled !== false) process.exit(1);
              if (data.globalRestartEnabled !== false) process.exit(1);
              if (data.coreReloadEnabled !== false) process.exit(1);
              if (!Array.isArray(data.candidates)) process.exit(1);
            });
          '
          curl -Ns --max-time 3 http://127.0.0.1:8090/api/events > /tmp/sse-events.txt || true
          grep -q "event: status" /tmp/sse-events.txt

      - name: Supervisor auth and role smoke test
        run: |
          docker rm -f stream-supervisor-ci
          docker run -d --name stream-supervisor-ci             -e DEMO_MODE=true             -e SUPERVISOR_USERNAME=ci-admin             -e SUPERVISOR_PASSWORD=ci-admin-pass             -e SUPERVISOR_TECH_USERNAME=ci-tech             -e SUPERVISOR_TECH_PASSWORD=ci-tech-pass             -p 8090:8090 stream-supervisor-ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null; then
              break
            fi
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/status)" = "401"
          curl -fsS -c /tmp/admin.cookies -H 'Content-Type: application/json' -d '{"username":"ci-admin","password":"ci-admin-pass"}' http://127.0.0.1:8090/api/login >/tmp/admin-login.json
          node -e 'const d=require("/tmp/admin-login.json"); if(d.role!=="super-admin"||!d.actionsEnabled||!d.authenticated)process.exit(1)'
          curl -fsS -b /tmp/admin.cookies http://127.0.0.1:8090/api/session >/tmp/admin-session.json
          node -e 'const d=require("/tmp/admin-session.json"); if(d.role!=="super-admin"||!d.actionsEnabled)process.exit(1)'
          test "$(curl -sS -b /tmp/admin.cookies -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/admin/restart-restreamer)" = "403"
          curl -fsS -c /tmp/tech.cookies -H 'Content-Type: application/json' -d '{"username":"ci-tech","password":"ci-tech-pass"}' http://127.0.0.1:8090/api/login >/tmp/tech-login.json
          node -e 'const d=require("/tmp/tech-login.json"); if(d.role!=="technician"||!d.actionsEnabled||!d.authenticated)process.exit(1)'
          test "$(curl -sS -b /tmp/tech.cookies -o /dev/null -w '%{http_code}' -X POST -H 'X-Supervisor-Action: 1' http://127.0.0.1:8090/api/admin/restart-restreamer)" = "403"
          test "$(curl -sS -b /tmp/admin.cookies -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"outputId":"demo-youtube","command":"stop"}' http://127.0.0.1:8090/api/restreamer/output-command)" = "403"
          curl -fsS -b /tmp/admin.cookies -c /tmp/admin.cookies -X POST -H 'X-Supervisor-Action: 1' http://127.0.0.1:8090/api/logout >/dev/null
          test "$(curl -sS -b /tmp/admin.cookies -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/status)" = "401"

      - name: Host System Adapter smoke test
        run: |
          docker rm -f stream-supervisor-ci
          sed -i 's#^RESTREAMER_BASE_URL=.*#RESTREAMER_BASE_URL=http://127.0.0.1:1#' .env
          sed -i 's#^RESTREAMER_UI_URL=.*#RESTREAMER_UI_URL=http://127.0.0.1:1#' .env
          export SYSTEM_NETWORK_INTERFACE="$(ip route show default | awk '/default/ {for (i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}')"
          test -r "/sys/class/net/$SYSTEM_NETWORK_INTERFACE/statistics/rx_bytes"
          test -r "/sys/class/net/$SYSTEM_NETWORK_INTERFACE/statistics/tx_bytes"
          docker compose up -d --build --remove-orphans
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null; then
              break
            fi
            sleep 1
          done
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8090/api/status | node -e '
              let raw="";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const data=JSON.parse(raw);
                if (!data.system?.available) process.exit(1);
                if (data.system?.scope !== "host") process.exit(1);
                if (!(data.system?.memory?.totalBytes > 0)) process.exit(1);
                if (!(data.system?.disk?.totalBytes > 0)) process.exit(1);
                if (!data.system?.network?.interface) process.exit(1);
                if (!data.docker?.connected) process.exit(1);
                if (!data.docker?.containers?.some(c => c.name === "stream-supervisor")) process.exit(1);
              });
            '; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"
          docker compose down -v
