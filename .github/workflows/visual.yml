name: visual

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive, accessibility and session acceptance tests
        run: npm run visual
      - name: Upload visual artifacts and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-supervisor-ui-preview
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
